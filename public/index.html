<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Hub</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><form onsubmit="login(event)"><h1>Company Hub</h1><p>Вход для сотрудников</p><input id="loginName" placeholder="Логин" value="admin"><input id="loginPass" placeholder="Пароль" type="password"><button>Войти</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="app hidden">
  <aside><div class="top"><h2>Компании</h2><button onclick="logout()">Выход</button></div><div class="theme-switch"><button type="button" class="theme-choice" data-theme="light" onclick="setTheme('light')">Светлая</button><button type="button" class="theme-choice" data-theme="dark" onclick="setTheme('dark')">Темная</button></div><input id="search" placeholder="Поиск по названию / ИНН / ОГРН" oninput="renderCompanies()"><div class="tabs"><button class="active" data-tab="card" onclick="tab('card')">Карточка</button><button data-tab="attorney" onclick="tab('attorney')">Доверенность</button><button data-tab="fssp" onclick="tab('fssp')">ФССП</button><button data-tab="fns" onclick="tab('fns')">ФНС</button></div><div id="list"></div></aside>
  <main><div class="bar"><div id="title">Выберите компанию</div><div class="bar-actions"><input id="oldHtmlFile" type="file" accept=".html,.htm,.txt" style="display:none" onchange="importOldHtmlFile(this)"><button class="btn-import" onclick="document.getElementById('oldHtmlFile').click()">Импорт из старого HTML</button><button class="btn-update" onclick="refreshDadata()">Обновить по ИНН</button></div></div><section id="content"></section><div class="action-footer"><button class="btn-download" onclick="downloadCurrent()">Скачать</button><button class="btn-print" onclick="printCurrent()">Печать</button></div></main>
</div><script src="app.js"></script></body></html>
